name: Deploy na GitHub Pages

# Każdy merge do main publikuje nową wersję. Zainstalowana aplikacja (PWA)
# sama wykryje aktualizację i pokaże komunikat „Jest nowa wersja aplikacji”.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pełna historia: numer wydania = liczba commitów na main (vite.config.ts)
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          APP_RELEASE: '1'
      # Znacznik v1.<numer> w repo – na GitHubie widać, który commit to które wydanie
      - name: Oznacz wydanie
        run: |
          tag="v1.$(git rev-list --count HEAD)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then echo "$tag już istnieje"; exit 0; fi
          git tag "$tag" && git push origin "$tag"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
